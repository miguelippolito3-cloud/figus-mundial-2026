<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Figus Mundial 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b}

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,#0f172a,#1e3a5f 60%,#1d4ed8);
  color:#fff;padding:12px 16px 10px;text-align:center;
  position:sticky;top:0;z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.4)
}
header h1{font-size:1.2em;letter-spacing:.5px;margin-bottom:2px}
.sub{font-size:.74em;opacity:.65;margin-bottom:8px}

/* ── USER BAR ── */
.user-bar{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  margin-bottom:8px
}
.upill{
  padding:5px 14px;border:none;border-radius:20px;cursor:pointer;
  font-size:.8em;font-weight:700;transition:transform .15s;
  background:rgba(255,255,255,.15);color:#fff;
}
.upill:hover{transform:scale(1.06)}
.upill.active{background:#fff;color:#0f172a}
.upill-add{background:rgba(255,255,255,.08);font-size:.75em;padding:5px 10px}

/* ── STATS ── */
.stats{
  background:rgba(255,255,255,.15);border-radius:20px;
  padding:4px 14px;display:inline-block;font-size:.78em;margin-bottom:8px
}

/* ── HEADER BUTTONS ── */
.hbtns{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.hbtn{
  padding:6px 14px;border:none;border-radius:20px;cursor:pointer;
  font-size:.78em;font-weight:700;transition:transform .15s,filter .15s
}
.hbtn:hover{transform:scale(1.05);filter:brightness(1.1)}
.hbtn-exp{background:#4ade80;color:#14532d}
.hbtn-prt{background:#60a5fa;color:#1e3a5f}
.hbtn-fil{background:#fbbf24;color:#78350f}

/* ── MAIN ── */
.main{padding:10px;max-width:1100px;margin:0 auto}
.legend{
  background:#fff;border-radius:10px;padding:8px 13px;margin-bottom:7px;
  font-size:.78em;display:flex;gap:12px;flex-wrap:wrap;align-items:center
}
.leg-item{display:flex;align-items:center;gap:4px}
.ld{
  width:22px;height:22px;border-radius:4px;font-size:.7em;font-weight:800;
  display:flex;align-items:center;justify-content:center
}
.ld-miss{background:#fee2e2;color:#b91c1c;border:1.5px solid #fca5a5}
.ld-have{background:#f0fdf4;color:#15803d;border:1.5px solid #bbf7d0}
.ld-dup {background:#fef3c7;color:#92400e;border:1.5px solid #fcd34d}
.hint{text-align:center;font-size:.73em;color:#94a3b8;margin-bottom:7px}

/* ── CARDS ── */
.card{
  background:#fff;border-radius:11px;margin-bottom:9px;
  box-shadow:0 2px 7px rgba(0,0,0,.07);overflow:hidden
}
.card.complete-hidden{display:none}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0
}
.card-label{font-size:.95em;font-weight:700}
.badge{font-size:.7em;padding:3px 9px;border-radius:10px;font-weight:700}
.badge-miss{background:#fee2e2;color:#991b1b}
.badge-done{background:#dcfce7;color:#166534}
.grid{padding:8px 11px;display:flex;flex-wrap:wrap;gap:4px}
.stk{
  min-width:32px;height:32px;border-radius:6px;border:none;cursor:pointer;
  font-size:.76em;font-weight:800;display:flex;align-items:center;
  justify-content:center;padding:0 5px;gap:1px;
  transition:transform .1s;user-select:none;-webkit-user-select:none
}
.stk:hover{transform:scale(1.18)}
.stk:active{transform:scale(.93)}
.stk.miss{background:#fee2e2;color:#b91c1c;border:1.5px solid #fca5a5}
.stk.have{background:#f0fdf4;color:#15803d;border:1.5px solid #bbf7d0}
.stk.dup {background:#fef3c7;color:#92400e;border:1.5px solid #fcd34d}
.stk.miss:hover{background:#fecaca}
.stk.have:hover{background:#dcfce7}
.stk.dup:hover {background:#fde68a}
.stk .cnt{font-size:.62em;vertical-align:super;line-height:0;margin-left:1px}
.card-foot{display:flex;gap:5px;padding:0 11px 8px}
.sbtn{font-size:.67em;padding:3px 9px;border-radius:9px;border:none;cursor:pointer;font-weight:700}
.sbtn:hover{filter:brightness(.93)}
.sbtn-all-miss{background:#fee2e2;color:#991b1b}
.sbtn-all-have{background:#dcfce7;color:#166534}

/* ── MODAL ── */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:200;align-items:center;justify-content:center;padding:16px
}
.overlay.open{display:flex}
.modal{
  background:#fff;border-radius:16px;padding:20px;width:100%;max-width:580px;
  max-height:85vh;overflow:hidden;display:flex;flex-direction:column;gap:11px
}
.modal h2{font-size:1.02em}
.mtext{
  background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;
  padding:11px;font-family:monospace;font-size:.8em;
  white-space:pre-wrap;word-break:break-word;overflow-y:auto;flex:1;max-height:55vh
}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
.mbtn{padding:7px 15px;border:none;border-radius:11px;cursor:pointer;font-size:.8em;font-weight:700}
.mbtn-copy{background:#4ade80;color:#14532d}
.mbtn-close{background:#e2e8f0;color:#374151}

/* ── SCREEN-ONLY ── */
#print-view{display:none}

/* ── PRINT ── */
@media print{
  @page{size:A4 portrait;margin:8mm 10mm}
  #app{display:none!important}
  #print-view{display:block!important}

  .phead{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1.5pt solid #000;padding-bottom:4pt;margin-bottom:6pt;
    font-size:9pt;line-height:1.4
  }
  .phead-left strong{font-size:11pt}
  .phead-right{font-size:8pt;text-align:right;color:#333}

  .pcols{
    column-count:3;column-gap:9pt;
    column-rule:.4pt solid #bbb;
    font-size:7.8pt;line-height:1.35
  }
  .prow{break-inside:avoid;margin-bottom:1.5pt}
  .plbl{font-weight:700}

  .psep{
    border-top:1pt solid #000;margin-top:5pt;padding-top:3pt;
    font-size:7.5pt;font-weight:700;margin-bottom:2pt;
    column-span:all
  }
  .pdup-cols{
    column-count:3;column-gap:9pt;
    font-size:7.5pt;line-height:1.3
  }
}
</style>
</head>
<body>

<!-- ── SCREEN APP ─────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <h1>⚽ Figuritas Mundial 2026</h1>
    <div class="sub">México · Canadá · USA · Panini</div>
    <div class="user-bar" id="userBar"></div>
    <div class="stats" id="stats">Cargando…</div>
    <div class="hbtns">
      <button class="hbtn hbtn-exp" id="btnExport">📋 Exportar</button>
      <button class="hbtn hbtn-prt" id="btnPrint">🖨️ Imprimir</button>
      <button class="hbtn hbtn-fil" id="btnFilter">👁 Solo faltan</button>
    </div>
  </header>

  <div class="main">
    <div class="legend">
      <strong>Cómo usar:</strong>
      <div class="leg-item"><div class="ld ld-miss">5</div>Falta</div>
      <div class="leg-item"><div class="ld ld-have">5</div>La tengo</div>
      <div class="leg-item"><div class="ld ld-dup">5<span style="font-size:.55em;vertical-align:super">×2</span></div>Repetida</div>
      <span style="color:#94a3b8;font-size:.75em">· Clic = sumar · Clic derecho = restar</span>
    </div>
    <div class="hint">Rojo = falta · Verde = tengo · Amarillo = repetida para cambiar</div>
    <div id="cards"></div>
  </div>
</div>

<!-- ── PRINT VIEW (solo al imprimir) ─────────────────────────────── -->
<div id="print-view"></div>

<!-- ── EXPORT MODAL ───────────────────────────────────────────────── -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>📋 Texto para WhatsApp</h2>
    <div class="mtext" id="mtext"></div>
    <div class="mbtns">
      <button class="mbtn mbtn-copy" id="btnCopy">📋 Copiar</button>
      <button class="mbtn mbtn-close" id="btnClose">✕ Cerrar</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ── ALBUM DATA ────────────────────────────────────────────────────────────────
const R = (n, s=1) => Array.from({length:n},(_,i)=>String(i+s));

const SECS = [
  {id:'FWC1', label:'FWC 🏆',    stk:['00','1','2','3','4']},
  {id:'FWC2', label:'FWC 🌎',    stk:['5','6','7','8']},
  {id:'FWC3', label:'FWC 📜',    stk:R(11,9)},
  {id:'MEX',  label:'MEX 🇲🇽',  stk:R(20)},
  {id:'RSA',  label:'RSA 🇿🇦',  stk:R(20)},
  {id:'KOR',  label:'KOR 🇰🇷',  stk:R(20)},
  {id:'CZE',  label:'CZE 🇨🇿',  stk:R(20)},
  {id:'CAN',  label:'CAN 🇨🇦',  stk:R(20)},
  {id:'BIH',  label:'BIH 🇧🇦',  stk:R(20)},
  {id:'QAT',  label:'QAT 🇶🇦',  stk:R(20)},
  {id:'SUI',  label:'SUI 🇨🇭',  stk:R(20)},
  {id:'BRA',  label:'BRA 🇧🇷',  stk:R(20)},
  {id:'MAR',  label:'MAR 🇲🇦',  stk:R(20)},
  {id:'HAI',  label:'HAI 🇭🇹',  stk:R(20)},
  {id:'SCO',  label:'SCO 🏴󠁧󠁢󠁳󠁣󠁴󠁿', stk:R(20)},
  {id:'USA',  label:'USA 🇺🇸',  stk:R(20)},
  {id:'PAR',  label:'PAR 🇵🇾',  stk:R(20)},
  {id:'AUS',  label:'AUS 🇦🇺',  stk:R(20)},
  {id:'TUR',  label:'TUR 🇹🇷',  stk:R(20)},
  {id:'GER',  label:'GER 🇩🇪',  stk:R(20)},
  {id:'CUW',  label:'CUW 🇨🇼',  stk:R(20)},
  {id:'CIV',  label:'CIV 🇨🇮',  stk:R(20)},
  {id:'ECU',  label:'ECU 🇪🇨',  stk:R(20)},
  {id:'NED',  label:'NED 🇳🇱',  stk:R(20)},
  {id:'JPN',  label:'JPN 🇯🇵',  stk:R(20)},
  {id:'SWE',  label:'SWE 🇸🇪',  stk:R(20)},
  {id:'TUN',  label:'TUN 🇹🇳',  stk:R(20)},
  {id:'BEL',  label:'BEL 🇧🇪',  stk:R(20)},
  {id:'EGY',  label:'EGY 🇪🇬',  stk:R(20)},
  {id:'IRN',  label:'IRN 🇮🇷',  stk:R(20)},
  {id:'NZL',  label:'NZL 🇳🇿',  stk:R(20)},
  {id:'ESP',  label:'ESP 🇪🇸',  stk:R(20)},
  {id:'CPV',  label:'CPV 🇨🇻',  stk:R(20)},
  {id:'KSA',  label:'KSA 🇸🇦',  stk:R(20)},
  {id:'URU',  label:'URU 🇺🇾',  stk:R(20)},
  {id:'FRA',  label:'FRA 🇫🇷',  stk:R(20)},
  {id:'SEN',  label:'SEN 🇸🇳',  stk:R(20)},
  {id:'IRQ',  label:'IRQ 🇮🇶',  stk:R(20)},
  {id:'NOR',  label:'NOR 🇳🇴',  stk:R(20)},
  {id:'ARG',  label:'ARG 🇦🇷',  stk:R(20)},
  {id:'ALG',  label:'ALG 🇩🇿',  stk:R(20)},
  {id:'AUT',  label:'AUT 🇦🇹',  stk:R(20)},
  {id:'JOR',  label:'JOR 🇯🇴',  stk:R(20)},
  {id:'POR',  label:'POR 🇵🇹',  stk:R(20)},
  {id:'COD',  label:'COD 🇨🇩',  stk:R(20)},
  {id:'UZB',  label:'UZB 🇺🇿',  stk:R(20)},
  {id:'COL',  label:'COL 🇨🇴',  stk:R(20)},
  {id:'ENG',  label:'ENG 🏴󠁧󠁢󠁥󠁮󠁧󠁿', stk:R(20)},
  {id:'CRO',  label:'CRO 🇭🇷',  stk:R(20)},
  {id:'GHA',  label:'GHA 🇬🇭',  stk:R(20)},
  {id:'PAN',  label:'PAN 🇵🇦',  stk:R(20)},
  {id:'CC',   label:'CC ⭐',    stk:R(14)},
];

// ── MIKE'S INITIAL STATE (stickers that are MISSING) ──────────────────────────
const MIKE_MISSING = {
  FWC1:['4'],        FWC2:['5'],        FWC3:[],
  MEX: ['6','15','17','18','20'],
  RSA: ['8','12','14','17','18'],
  KOR: ['3','7','16','19','20'],
  CZE: ['1','14'],
  CAN: ['10','14','17','18'],
  BIH: ['18'],
  QAT: ['1','5','14','16','18'],
  SUI: ['4','7','15','18','19'],
  BRA: ['9','16','18','20'],
  MAR: ['3','5','14'],
  HAI: ['1','6','10'],
  SCO: ['4','6','8','12','15','16','17'],
  USA: [],
  PAR: ['5','9','16','17'],
  AUS: ['2','4','6','11','15','16','18'],
  TUR: ['4'],
  GER: ['2','8','10','14','15','18'],
  CUW: ['5','8','9','12','14','15','19'],
  CIV: ['3','6','8','10','12','15','17'],
  ECU: ['7','9','11','17'],
  NED: [],
  JPN: ['16'],
  SWE: ['1','6','9','12','15','20'],
  TUN: ['3','6','19'],
  BEL: ['2','6','11','14','18'],
  EGY: ['4','8','18'],
  IRN: ['5','6','9','10','12','14','15','16','17'],
  NZL: ['7','10','11','16'],
  ESP: ['1','3','4','7','10','12','14','16','19'],
  CPV: ['2','6','15','17','20'],
  KSA: ['5','9','14','18','19'],
  URU: ['2','3','5','6','8','9','17'],
  FRA: ['5','6','10','14','15','18'],
  SEN: ['7','18'],
  IRQ: [],
  NOR: ['4','5','9','18'],
  ARG: ['17'],
  ALG: ['3','4','5','14','18','19'],
  AUT: ['2','3','6','9','10','15','16','19','20'],
  JOR: ['2','3','4','5','8','10','12','15','16','19','20'],
  POR: ['10','17','19'],
  COD: ['3','4','8','18'],
  UZB: ['1','3','14'],
  COL: ['3','4','5','6','12','14','15','16','17'],
  ENG: ['18'],
  CRO: ['2','5','8','14'],
  GHA: ['1','3','6','10','15'],
  PAN: ['3','5','6','9','10','14','15','19'],
  CC:  [],
};

// ── USER STORAGE ──────────────────────────────────────────────────────────────
const KEY_USERS  = 'figus26-users';
const KEY_ACTIVE = 'figus26-active';
const dataKey    = id => 'figus26-data-' + id;

let users = [];      // [{id, name}, ...]
let activeUser = null;
let counts = {};     // counts[secId][sticker] = 0/1/2+
let filterOn = false;

function initCountsBlank() {
  const c = {};
  for (const s of SECS) { c[s.id] = {}; for (const n of s.stk) c[s.id][n] = 0; }
  return c;
}

function initCountsMike() {
  const c = {};
  for (const s of SECS) {
    c[s.id] = {};
    const miss = new Set(MIKE_MISSING[s.id] || []);
    for (const n of s.stk) c[s.id][n] = miss.has(n) ? 0 : 1;
  }
  return c;
}

function loadCounts(userId) {
  try {
    const raw = localStorage.getItem(dataKey(userId));
    if (!raw) return null;
    const p = JSON.parse(raw);
    const c = initCountsBlank();
    for (const s of SECS)
      if (p[s.id]) for (const n of s.stk)
        if (typeof p[s.id][n] === 'number' && p[s.id][n] >= 0) c[s.id][n] = p[s.id][n];
    return c;
  } catch { return null; }
}

function saveCounts(userId, c) {
  try { localStorage.setItem(dataKey(userId), JSON.stringify(c)); } catch {}
}

function save() { if (activeUser) saveCounts(activeUser, counts); }

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(KEY_USERS) || 'null'); } catch { return null; }
}

function saveUsers() {
  localStorage.setItem(KEY_USERS, JSON.stringify(users));
}

function bootstrap() {
  users = loadUsers();
  if (!users) {
    // First run: create default users
    users = [{id:'Mike', name:'Mike'}, {id:'FLM', name:'FLM'}];
    saveUsers();
    // Pre-populate Mike
    saveCounts('Mike', initCountsMike());
    // FLM starts blank (already blank in storage = treated as blank)
  }

  // Determine active user
  const savedActive = localStorage.getItem(KEY_ACTIVE);
  const validId = savedActive && users.find(u => u.id === savedActive);
  activeUser = validId ? savedActive : users[0].id;
  localStorage.setItem(KEY_ACTIVE, activeUser);

  // Load counts for active user
  counts = loadCounts(activeUser) || (activeUser === 'Mike' ? initCountsMike() : initCountsBlank());
}

// ── USER SWITCHING ────────────────────────────────────────────────────────────
function switchUser(userId) {
  if (userId === activeUser) return;
  save(); // save current user first
  activeUser = userId;
  localStorage.setItem(KEY_ACTIVE, userId);
  counts = loadCounts(userId) || initCountsBlank();
  renderUserBar();
  render();
}

function addUser() {
  const name = prompt('Nombre del nuevo perfil (ej: JUAN, SOF):');
  if (!name || !name.trim()) return;
  const id = name.trim().replace(/\s+/g,'_').toUpperCase().slice(0,10);
  if (users.find(u => u.id === id)) { alert('Ya existe ese perfil.'); return; }
  save();
  users.push({id, name: name.trim().toUpperCase()});
  saveUsers();
  // new user starts blank
  activeUser = id;
  localStorage.setItem(KEY_ACTIVE, id);
  counts = initCountsBlank();
  renderUserBar();
  render();
}

// ── RENDER USER BAR ───────────────────────────────────────────────────────────
function renderUserBar() {
  const bar = document.getElementById('userBar');
  bar.innerHTML = users.map(u =>
    `<button class="upill${u.id===activeUser?' active':''}" data-uid="${u.id}">${u.name}</button>`
  ).join('') + `<button class="upill upill-add" id="btnAddUser">＋ Agregar</button>`;
}

// ── RENDER CARDS ──────────────────────────────────────────────────────────────
function stkClass(c)       { return 'stk ' + (c===0?'miss':c===1?'have':'dup'); }
function stkContent(n, c)  { return c<=1 ? n : n+'<span class="cnt">×'+c+'</span>'; }

function cardIsDone(s)     { return s.stk.every(n => counts[s.id][n] > 0); }
function cardClass(s)      {
  const done = cardIsDone(s);
  return 'card'+(done?' section-complete':'')+(filterOn&&done?' complete-hidden':'');
}

function render() {
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  for (const s of SECS) {
    const done = cardIsDone(s);
    const miss = s.stk.filter(n => counts[s.id][n]===0).length;
    const dups = s.stk.filter(n => counts[s.id][n]>=2).length;

    const div = document.createElement('div');
    div.className = cardClass(s);
    div.id = 'card-'+s.id;
    div.innerHTML =
      `<div class="card-head">
         <span class="card-label">${s.label}</span>
         <span class="badge ${done?'badge-done':'badge-miss'}" id="badge-${s.id}">
           ${done?'✓ Completo':'Faltan '+miss+'/'+s.stk.length+(dups?' · '+dups+' rep':'')}
         </span>
       </div>
       <div class="grid" id="grid-${s.id}">
         ${s.stk.map(n=>`<button class="${stkClass(counts[s.id][n])}" data-sec="${s.id}" data-n="${n}">${stkContent(n,counts[s.id][n])}</button>`).join('')}
       </div>
       <div class="card-foot">
         <button class="sbtn sbtn-all-miss" data-action="all-miss" data-sec="${s.id}">Todo falta</button>
         <button class="sbtn sbtn-all-have" data-action="all-have" data-sec="${s.id}">Todo tengo</button>
       </div>`;
    wrap.appendChild(div);
  }
  refreshStats();
}

function updateOneBtn(secId, n) {
  const grid = document.getElementById('grid-'+secId);
  if (!grid) return;
  const btn = grid.querySelector(`[data-n="${n}"]`);
  if (!btn) return;
  const c = counts[secId][n];
  btn.className = stkClass(c);
  btn.innerHTML = stkContent(n, c);
}

function updateGrid(secId) {
  const s = SECS.find(x=>x.id===secId);
  const grid = document.getElementById('grid-'+secId);
  if (!grid||!s) return;
  grid.innerHTML = s.stk.map(n=>`<button class="${stkClass(counts[s.id][n])}" data-sec="${s.id}" data-n="${n}">${stkContent(n,counts[s.id][n])}</button>`).join('');
}

function updateBadge(secId) {
  const s = SECS.find(x=>x.id===secId);
  if (!s) return;
  const done = cardIsDone(s);
  const miss = s.stk.filter(n=>counts[s.id][n]===0).length;
  const dups = s.stk.filter(n=>counts[s.id][n]>=2).length;
  const card = document.getElementById('card-'+secId);
  if (card) card.className = cardClass(s);
  const badge = document.getElementById('badge-'+secId);
  if (!badge) return;
  badge.className = 'badge '+(done?'badge-done':'badge-miss');
  badge.textContent = done?'✓ Completo':'Faltan '+miss+'/'+s.stk.length+(dups?' · '+dups+' rep':'');
}

function refreshStats() {
  let total=0, miss=0, dups=0;
  for (const s of SECS) for (const n of s.stk) {
    total++; const c=counts[s.id][n];
    if(c===0) miss++; if(c>=2) dups++;
  }
  const user = users.find(u=>u.id===activeUser);
  document.getElementById('stats').textContent =
    (user?user.name+' · ':'')+`Tengo ${total-miss}/${total} · Faltan ${miss}`+(dups?` · Repetidas ${dups}`:'');
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
// User bar (event delegation)
document.getElementById('userBar').addEventListener('click', e => {
  const pill = e.target.closest('[data-uid]');
  if (pill) { switchUser(pill.dataset.uid); return; }
  if (e.target.id==='btnAddUser') addUser();
});

// Cards: left click
document.getElementById('cards').addEventListener('click', e => {
  const stkBtn = e.target.closest('[data-n]');
  if (stkBtn && stkBtn.dataset.sec) {
    const sid=stkBtn.dataset.sec, n=stkBtn.dataset.n;
    counts[sid][n]++;
    save();
    updateOneBtn(sid,n); updateBadge(sid); refreshStats();
    return;
  }
  const act = e.target.closest('[data-action]');
  if (act && act.dataset.sec) {
    const sid=act.dataset.sec, s=SECS.find(x=>x.id===sid);
    if (!s) return;
    if (act.dataset.action==='all-miss') { for (const n of s.stk) counts[sid][n]=0; }
    else if (act.dataset.action==='all-have') { for (const n of s.stk) if(counts[sid][n]===0) counts[sid][n]=1; }
    save(); updateGrid(sid); updateBadge(sid); refreshStats();
  }
});

// Cards: right click → decrement
document.getElementById('cards').addEventListener('contextmenu', e => {
  const stkBtn = e.target.closest('[data-n]');
  if (!stkBtn||!stkBtn.dataset.sec) return;
  e.preventDefault();
  const sid=stkBtn.dataset.sec, n=stkBtn.dataset.n;
  if (counts[sid][n]>0) { counts[sid][n]--; save(); updateOneBtn(sid,n); updateBadge(sid); refreshStats(); }
});

// Filter
document.getElementById('btnFilter').addEventListener('click', function() {
  filterOn=!filterOn;
  this.textContent=filterOn?'👁 Ver todos':'👁 Solo faltan';
  for (const s of SECS) { const c=document.getElementById('card-'+s.id); if(c) c.className=cardClass(s); }
});

// ── EXPORT ────────────────────────────────────────────────────────────────────
function buildText() {
  const d=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  let total=0, miss=0;
  for (const s of SECS){total+=s.stk.length; miss+=s.stk.filter(n=>counts[s.id][n]===0).length;}
  const user=users.find(u=>u.id===activeUser);

  const missLines=[];
  for (const s of SECS){
    const m=s.stk.filter(n=>counts[s.id][n]===0).sort((a,b)=>a==='00'?-1:b==='00'?1:+a-+b);
    if(m.length) missLines.push(`${s.label}: ${m.join(', ')}`);
  }
  const dupLines=[];
  for (const s of SECS){
    const d2=s.stk.filter(n=>counts[s.id][n]>=2);
    if(d2.length) dupLines.push(`${s.label}: ${d2.map(n=>`${counts[s.id][n]}×${n}`).join(', ')}`);
  }

  let t=`Méx Can 26 — Me faltan (${d})`;
  if(user) t+=` — ${user.name}`;
  t+=`\nTengo ${total-miss}/${total} · Faltan ${miss}\n`;
  t+='\n'+(missLines.length?missLines.join('\n'):'¡Álbum completo! 🎉');
  if(dupLines.length) t+='\n\n— Tengo repetidas para cambiar —\n'+dupLines.join('\n');
  return t;
}

document.getElementById('btnExport').addEventListener('click',()=>{
  document.getElementById('mtext').textContent=buildText();
  document.getElementById('overlay').classList.add('open');
});
document.getElementById('btnClose').addEventListener('click',()=>document.getElementById('overlay').classList.remove('open'));
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open');});
document.getElementById('btnCopy').addEventListener('click',function(){
  const text=document.getElementById('mtext').textContent, btn=this;
  const done=()=>{btn.textContent='✓ ¡Copiado!';setTimeout(()=>btn.textContent='📋 Copiar',2000);};
  if(navigator.clipboard){navigator.clipboard.writeText(text).then(done).catch(()=>fbCopy(text,done));}
  else fbCopy(text,done);
});
function fbCopy(t,cb){
  const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');cb();}catch{}
  document.body.removeChild(ta);
}

// ── PRINT ─────────────────────────────────────────────────────────────────────
document.getElementById('btnPrint').addEventListener('click',()=>{
  const d=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  let total=0, miss=0;
  for(const s of SECS){total+=s.stk.length;miss+=s.stk.filter(n=>counts[s.id][n]===0).length;}
  const user=users.find(u=>u.id===activeUser);
  const pct=Math.round((total-miss)/total*100);

  const missRows=[];
  for(const s of SECS){
    const m=s.stk.filter(n=>counts[s.id][n]===0).sort((a,b)=>a==='00'?-1:b==='00'?1:+a-+b);
    if(m.length) missRows.push(`<div class="prow"><span class="plbl">${s.label}:</span> ${m.join(', ')}</div>`);
  }
  const dupRows=[];
  for(const s of SECS){
    const d2=s.stk.filter(n=>counts[s.id][n]>=2);
    if(d2.length) dupRows.push(`<div class="prow"><span class="plbl">${s.label}:</span> ${d2.map(n=>`${counts[s.id][n]}×${n}`).join(', ')}</div>`);
  }

  document.getElementById('print-view').innerHTML=`
    <div class="phead">
      <div class="phead-left">
        <strong>⚽ Figuritas Mundial 2026${user?' — '+user.name:''}</strong><br>
        Méx Can 26 — Me faltan (${d})
      </div>
      <div class="phead-right">
        Tengo <strong>${total-miss}/${total}</strong> (${pct}%)<br>
        <strong>Faltan ${miss}</strong>
      </div>
    </div>
    <div class="pcols">${missRows.join('')}</div>
    ${dupRows.length?`<div class="psep">Tengo repetidas para cambiar:</div><div class="pdup-cols">${dupRows.join('')}</div>`:''}
  `;
  window.print();
});

// ── INIT ──────────────────────────────────────────────────────────────────────
bootstrap();
renderUserBar();
render();
</script>
